<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>试香吧 · 自助试香终端</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="statusbar">
        <span class="sb-time">9:41</span>
        <span class="sb-icons">
          <i class="sb-signal"></i><i class="sb-signal"></i><i class="sb-signal"></i><i class="sb-signal off"></i>
          <i class="sb-wifi"></i>
          <i class="sb-batt"><i class="sb-batt-core"></i></i>
        </span>
      </div>
      <div class="navbar">
        <div class="nav-back" id="navBack" hidden>&lt;</div>
        <div class="nav-title" id="navTitle">试香吧</div>
        <div class="capsule"><span class="cap-dots">••&nbsp;•</span><span class="cap-ring"></span></div>
      </div>
      <main class="view" id="view"></main>
      <nav class="tabbar" id="tabbar">
        <button class="tab" data-tab="home"><span class="tab-ico">✦</span><span>首页</span></button>
        <button class="tab" data-tab="orders"><span class="tab-ico">❐</span><span>订单</span></button>
        <button class="tab" data-tab="mine"><span class="tab-ico">☺</span><span>我的</span></button>
      </nav>
    </div>
    <div class="stage-tip">自助试香终端 · 前端样式演示版（接口全部 Mock，见《接口文档.md》）</div>
  </div>

  <!-- 全局浮层 -->
  <div class="toast" id="toast" hidden></div>
  <div class="loading-mask" id="loading" hidden><div class="loading-box"><span class="spin"></span>加载中…</div></div>

  <script src="js/mock.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
